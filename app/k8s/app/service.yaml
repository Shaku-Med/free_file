apiVersion: v1
kind: Service
metadata:
  name: free-file-app
  namespace: free-file
  labels:
    app: free-file-app
spec:
  type: LoadBalancer  # Use ClusterIP for internal access, NodePort for external access, or LoadBalancer for cloud providers
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: free-file-app

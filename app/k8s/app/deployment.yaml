apiVersion: apps/v1
kind: Deployment
metadata:
  name: free-file-app
  namespace: free-file
  labels:
    app: free-file-app
spec:
  replicas: 2  # Adjust based on your needs
  selector:
    matchLabels:
      app: free-file-app
  template:
    metadata:
      labels:
        app: free-file-app
    spec:
      containers:
      - name: app
        image: free-file-app:latest  # Change this to your container registry
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Uncomment if you need volume mounts
        # volumeMounts:
        # - name: app-data
        #   mountPath: /app/data
      # Uncomment if you need volumes
      # volumes:
      # - name: app-data
      #   persistentVolumeClaim:
      #     claimName: app-pvc

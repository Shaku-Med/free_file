<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://memories.brozy.org; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Memories Brozy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --bg-color: #0f1419;
      --bg-gradient: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      --text-color: rgba(255, 255, 255, 0.85);
      --text-muted: rgba(255, 255, 255, 0.6);
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --btn-hover: rgba(34, 197, 94, 0.2);
      --btn-active: rgba(34, 197, 94, 0.3);
      --border-color: rgba(34, 197, 94, 0.2);
    }
    
    :root.light {
      --bg-color: #ffffff;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      --text-color: rgba(0, 0, 0, 0.85);
      --text-muted: rgba(0, 0, 0, 0.6);
      --accent: #16a34a;
      --accent-hover: #15803d;
      --btn-hover: rgba(22, 163, 74, 0.15);
      --btn-active: rgba(22, 163, 74, 0.25);
      --border-color: rgba(22, 163, 74, 0.2);
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-color);
      transition: background 0.2s ease;
    }
    
    #titlebar {
      height: 32px;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      -webkit-app-region: drag;
      user-select: none;
      border-bottom: 1px solid var(--border-color);
      padding-right: 138px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-left: 10px;
      -webkit-app-region: no-drag;
    }
    
    .nav-btn {
      width: 34px;
      height: 26px;
      border: none;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s ease;
    }
    
    .nav-btn:hover:not(:disabled) {
      background: var(--btn-hover);
      color: var(--accent-hover);
    }
    
    .nav-btn:active:not(:disabled) {
      background: var(--btn-active);
      transform: scale(0.95);
    }
    
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    
    .nav-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    
    .title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: color 0.2s ease;
    }
    
    #webview-container {
      height: calc(100% - 32px);
      width: 100%;
    }
    
    webview {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="titlebar">
    <div class="nav-controls">
      <button class="nav-btn" id="back-btn" title="Go Back" disabled>
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <button class="nav-btn" id="forward-btn" title="Go Forward" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </button>
      <button class="nav-btn" id="refresh-btn" title="Refresh">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
    <span class="title">Memories Brozy</span>
  </div>
  <div id="webview-container">
    <webview id="webview" src="https://memories.brozy.org" allowpopups></webview>
  </div>
  
  <script>
    const backBtn = document.getElementById('back-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const refreshBtn = document.getElementById('refresh-btn');
    const webview = document.getElementById('webview');
    
    // Apply theme
    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.remove('light');
      } else {
        document.documentElement.classList.add('light');
      }
    }
    
    // Get initial theme
    window.electronAPI.getTheme().then(applyTheme);
    
    // Listen for theme changes
    window.electronAPI.onThemeChanged(applyTheme);
    
    // Update navigation button states
    function updateNavButtons() {
      backBtn.disabled = !webview.canGoBack();
      forwardBtn.disabled = !webview.canGoForward();
    }
    
    // Navigation button handlers
    backBtn.addEventListener('click', () => {
      if (webview.canGoBack()) {
        webview.goBack();
      }
    });
    
    forwardBtn.addEventListener('click', () => {
      if (webview.canGoForward()) {
        webview.goForward();
      }
    });
    
    refreshBtn.addEventListener('click', () => {
      webview.reload();
    });
    
    // Listen to webview navigation events
    webview.addEventListener('did-navigate', updateNavButtons);
    webview.addEventListener('did-navigate-in-page', updateNavButtons);
    webview.addEventListener('did-finish-load', updateNavButtons);
    
    // Also update on dom-ready
    webview.addEventListener('dom-ready', () => {
      updateNavButtons();
    });
    
    // Update title bar with website's page title
    const titleElement = document.querySelector('.title');
    
    webview.addEventListener('page-title-updated', (event) => {
      titleElement.textContent = event.title || 'Memories Brozy';
      document.title = event.title || 'Memories Brozy';
    });
    
    webview.addEventListener('did-finish-load', () => {
      const pageTitle = webview.getTitle();
      if (pageTitle) {
        titleElement.textContent = pageTitle;
        document.title = pageTitle;
      }
    });
  </script>
</body>
</html>

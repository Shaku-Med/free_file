name: goupload

# Resource limits assume a small VPS (~4 CPU / 8 GB). Tune via env vars before
# `docker compose up`. The adaptive worker pool inside goupload reads cgroup-v2
# memory.max + /proc/stat to stay within these caps.

services:
  redis:
    image: redis:7-alpine
    container_name: goupload-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - goupload-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  nsfwapi:
    image: ${NSFWAPI_IMAGE:-ghcr.io/OWNER/REPO/nsfwapi:latest}
    container_name: goupload-nsfwapi
    restart: unless-stopped
    env_file:
      - ./nsfwapi.env
    networks:
      - goupload-net
    deploy:
      resources:
        limits:
          cpus: "${NSFWAPI_CPUS:-1.0}"
          memory: ${NSFWAPI_MEM:-768M}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Local text-embedding sidecar (semantic search). Private network only,
  # never published; GoUpload is the sole caller (shared EMBED_API_SECRET).
  embedapi:
    image: ${EMBEDAPI_IMAGE:-ghcr.io/OWNER/REPO/embedapi:latest}
    container_name: goupload-embedapi
    restart: unless-stopped
    environment:
      EMBED_API_PORT: "3007"
      EMBED_API_SECRET: ${EMBED_API_SECRET:?set EMBED_API_SECRET in .env}
      EMBED_THREADS: "${EMBED_THREADS:-1}"
    networks:
      - goupload-net
    deploy:
      resources:
        limits:
          cpus: "${EMBEDAPI_CPUS:-0.75}"
          memory: ${EMBEDAPI_MEM:-512M}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:3007/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # Music/speech classifier sidecar (gates files.is_music). Private network
  # only, never published; GoUpload is the sole caller (shared MUSIC_API_SECRET).
  musicdetector:
    image: ${MUSICDETECTOR_IMAGE:-ghcr.io/OWNER/REPO/musicdetector:latest}
    container_name: goupload-musicdetector
    restart: unless-stopped
    # MUSIC_API_SECRET + the MUSIC_* tunables live here (like nsfwapi.env /
    # loadplay.env). On the VPS this file is written from the GitHub secret
    # MUSICDETECTOR_ENV; locally copy musicdetector.env.example.
    env_file:
      - ./musicdetector.env
    environment:
      # Forced here (not from the env file) so prod can't accidentally run in
      # fake-results mode and the port can't drift.
      MUSIC_API_PORT: "3008"
      MUSIC_ALLOW_STUB: "0"
    networks:
      - goupload-net
    deploy:
      resources:
        limits:
          cpus: "${MUSICDETECTOR_CPUS:-1.0}"
          memory: ${MUSICDETECTOR_MEM:-1536M}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:3008/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  goupload:
    image: ${GOUPLOAD_IMAGE:-ghcr.io/OWNER/REPO/goupload:latest}
    container_name: goupload
    restart: unless-stopped
    env_file:
      - ./goupload.env
    environment:
      REDIS_ADDR: redis:6379
      NSFW_API_URL: http://nsfwapi:3004/api/nsfw/detect
      EMBED_API_URL: http://embedapi:3007/embed
      EMBED_API_SECRET: ${EMBED_API_SECRET:?set EMBED_API_SECRET in .env}
      MUSIC_API_URL: http://musicdetector:3008/analyze
      MUSIC_API_SECRET: ${MUSIC_API_SECRET:?set MUSIC_API_SECRET in .env}
      # Adaptive worker pool  see internal/worker/pool.go. These can also live
      # in goupload.env if you prefer.
      WORKER_MIN: ${WORKER_MIN:-1}
      WORKER_MAX: ${WORKER_MAX:-6}
      WORKER_INITIAL: ${WORKER_INITIAL:-2}
    ports:
      - "127.0.0.1:${GOUPLOAD_PORT:-3003}:3003"
    volumes:
      - upload-data:/app/upload
    networks:
      - goupload-net
    depends_on:
      redis:
        condition: service_healthy
      nsfwapi:
        condition: service_started
      embedapi:
        condition: service_started
      musicdetector:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "${GOUPLOAD_CPUS:-2.5}"
          memory: ${GOUPLOAD_MEM:-4G}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # CDN-style playback service. Separate binary from `goupload` (same
  # `go.mod`, different `main` package), separate Dockerfile, separate
  # port. Validates HMAC playback tokens, proxies segments (storage hidden).
  loadplay:
    image: ${LOADPLAY_IMAGE:-ghcr.io/OWNER/REPO/loadplay:latest}
    container_name: goupload-loadplay
    restart: unless-stopped
    env_file:
      - ./loadplay.env
    environment:
      # On-disk segment cache. loadplay caps it at SEGMENT_CACHE_MAX_BYTES and
      # sweeps entries older than SEGMENT_CACHE_TTL every SEGMENT_CACHE_SWEEP,
      # so the volume below never grows past ~20 GiB.
      - SEGMENT_CACHE_DIR=/cache
      - SEGMENT_CACHE_MAX_BYTES=${LOADPLAY_CACHE_BYTES:-21474836480}
      - SEGMENT_CACHE_TTL=${LOADPLAY_CACHE_TTL:-1h}
      - SEGMENT_CACHE_SWEEP=${LOADPLAY_CACHE_SWEEP:-1h}
    ports:
      - "127.0.0.1:${LOADPLAY_PORT:-3006}:3006"
    volumes:
      - loadplay-cache:/cache
    networks:
      - goupload-net
    deploy:
      resources:
        limits:
          cpus: "${LOADPLAY_CPUS:-0.4}"
          memory: ${LOADPLAY_MEM:-256M}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  goupload-net:
    driver: bridge

volumes:
  redis-data:
  upload-data:
  loadplay-cache:

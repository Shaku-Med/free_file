name: goupload

# Resource limits assume a small VPS (2 CPU / 8 GB, KVM 2). Tune via env vars
# before `docker compose up`. The adaptive worker pool inside goupload reads
# cgroup-v2 memory.max + /proc/stat to stay within these caps.
#
# NOTE ON THE CPU NUMBERS: the limits below add up to more vCPU than the box
# has. That is deliberate for burst work, since they are ceilings and not
# reservations, but it means two heavy jobs at once WILL contend. The memory
# figures are the ones to watch: they total close to the whole 8 GB, so raising
# any of them without lowering another risks the OOM killer.

# Docker's default json-file driver keeps logs FOREVER. Several chatty services
# on a 100 GB disk is how a box quietly fills up with nothing but text, so every
# service caps its own logs. 10M x 3 files x N services stays bounded.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# For every service whose image already runs as a non root user (all but
# redis, whose entrypoint has to switch users): even code run through a bad
# file can't regain root through a setuid binary or use a Linux capability.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # The password lives in redis.env, which goupload-compose.sh makes once on
  # the box (root 0600) and keeps across deploys. It is never in git or CI.
  # Only goupload and acoustid share the internal cache network, so a sidecar
  # that handles untrusted files (nsfwapi) can't even reach the queue.
  redis:
    image: redis:7-alpine
    container_name: goupload-redis
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./redis.env
    command:
      - sh
      - -c
      - >-
        [ -n "$$REDIS_PASSWORD" ] || { echo "REDIS_PASSWORD missing" >&2; exit 1; };
        exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"
        --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - goupload-cache
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 3s
      retries: 5

  nsfwapi:
    image: ${NSFWAPI_IMAGE:-ghcr.io/OWNER/REPO/nsfwapi:latest}
    container_name: goupload-nsfwapi
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    env_file:
      - ./nsfwapi.env
    networks:
      - goupload-net
    deploy:
      resources:
        limits:
          cpus: "${NSFWAPI_CPUS:-1.0}"
          memory: ${NSFWAPI_MEM:-768M}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Local text-embedding sidecar (semantic search). Private network only,
  # never published; GoUpload is the sole caller (shared EMBED_API_SECRET).
  embedapi:
    image: ${EMBEDAPI_IMAGE:-ghcr.io/OWNER/REPO/embedapi:latest}
    container_name: goupload-embedapi
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    environment:
      EMBED_API_PORT: "3007"
      EMBED_API_SECRET: ${EMBED_API_SECRET:?set EMBED_API_SECRET in .env}
      EMBED_THREADS: "${EMBED_THREADS:-1}"
    networks:
      - goupload-net
    deploy:
      resources:
        limits:
          cpus: "${EMBEDAPI_CPUS:-0.75}"
          # The multilingual model needs more headroom than the old bge-small.
          memory: ${EMBEDAPI_MEM:-1G}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:3007/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # Music/speech classifier sidecar (gates files.is_music). Private network
  # only, never published; GoUpload is the sole caller (shared MUSIC_API_SECRET).
  musicdetector:
    image: ${MUSICDETECTOR_IMAGE:-ghcr.io/OWNER/REPO/musicdetector:latest}
    container_name: goupload-musicdetector
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    # MUSIC_API_SECRET + the MUSIC_* tunables live here (like nsfwapi.env /
    # loadplay.env). On the VPS this file is written from the GitHub secret
    # MUSICDETECTOR_ENV; locally copy musicdetector.env.example.
    env_file:
      - ./musicdetector.env
    environment:
      # Forced here (not from the env file) so prod can't accidentally run in
      # fake-results mode and the port can't drift.
      MUSIC_API_PORT: "3008"
      MUSIC_ALLOW_STUB: "0"
    networks:
      - goupload-net
    deploy:
      resources:
        limits:
          cpus: "${MUSICDETECTOR_CPUS:-1.0}"
          memory: ${MUSICDETECTOR_MEM:-1536M}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:3008/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # AcoustID sidecar (song metadata via Chromaprint + AcoustID). Private
  # network only; GoUpload posts a short MP3 clip, this service queues work
  # on Redis and processes ONE job at a time (~3 lookups/sec).
  acoustid:
    image: ${ACOUSTID_IMAGE:-ghcr.io/OWNER/REPO/acoustid:latest}
    container_name: goupload-acoustid
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    # redis.env comes last so its REDIS_PASSWORD wins over any stale one in
    # acoustid.env.
    env_file:
      - ./acoustid.env
      - ./redis.env
    environment:
      ACOUSTID_API_PORT: "3009"
      REDIS_ADDR: redis:6379
      ACOUSTID_API_SECRET: ${ACOUSTID_API_SECRET:?set ACOUSTID_API_SECRET in .env}
      # Same app webhook target/secret as goupload (forced so they can't drift).
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
      UPLOAD_WEBHOOK_SECRET: ${UPLOAD_WEBHOOK_SECRET:?set UPLOAD_WEBHOOK_SECRET in .env}
      # Results + cover art go through GoUpload so covers are hosted like thumbnails.
      GOUPLOAD_INTERNAL_URL: http://goupload:3003
    networks:
      - goupload-net
      - goupload-cache
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${ACOUSTID_CPUS:-0.5}"
          memory: ${ACOUSTID_MEM:-256M}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:3009/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  goupload:
    image: ${GOUPLOAD_IMAGE:-ghcr.io/OWNER/REPO/goupload:latest}
    container_name: goupload
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    # Last file wins, so the box's Redis password beats the empty
    # REDIS_PASSWORD that goupload.env may still carry.
    env_file:
      - ./goupload.env
      - ./redis.env
    environment:
      REDIS_ADDR: redis:6379
      NSFW_API_URL: http://nsfwapi:3004/api/nsfw/detect
      EMBED_API_URL: http://embedapi:3007/embed
      EMBED_API_SECRET: ${EMBED_API_SECRET:?set EMBED_API_SECRET in .env}
      MUSIC_API_URL: http://musicdetector:3008/analyze
      MUSIC_API_SECRET: ${MUSIC_API_SECRET:?set MUSIC_API_SECRET in .env}
      ACOUSTID_API_URL: http://acoustid:3009
      ACOUSTID_API_SECRET: ${ACOUSTID_API_SECRET:?set ACOUSTID_API_SECRET in .env}
      # On-VPS audio fingerprint store (SQLite). Lives on its own volume so it
      # survives container recreation and reboots; hard-capped at 10 GiB.
      FINGERPRINT_DB_PATH: /data/fingerprints/fp.db
      FINGERPRINT_DB_MAX_BYTES: ${FINGERPRINT_DB_MAX_BYTES:-10737418240}
      # Adaptive worker pool  see internal/worker/pool.go. These can also live
      # in goupload.env if you prefer. Two encodes at most on a 2 core box, so
      # playback and the API never wait behind a queue of transcodes.
      WORKER_MIN: ${WORKER_MIN:-1}
      WORKER_MAX: ${WORKER_MAX:-2}
      WORKER_INITIAL: ${WORKER_INITIAL:-1}
      # ffmpeg runs under nice at this level (0 to 19, 0 = normal priority).
      FFMPEG_NICE: ${FFMPEG_NICE:-10}
    ports:
      - "127.0.0.1:${GOUPLOAD_PORT:-3003}:3003"
    volumes:
      - upload-data:/app/upload
      - fingerprint-data:/data/fingerprints
    networks:
      - goupload-net
      - goupload-cache
    depends_on:
      redis:
        condition: service_healthy
      nsfwapi:
        condition: service_started
      embedapi:
        condition: service_started
      musicdetector:
        condition: service_started
      acoustid:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "${GOUPLOAD_CPUS:-2.5}"
          memory: ${GOUPLOAD_MEM:-4G}
    healthcheck:
      # 127.0.0.1, not localhost: Fiber binds IPv4 only and Alpine resolves
      # localhost to ::1 first, so the probe was refused since day one.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # CDN-style playback service. Separate binary from `goupload` (same
  # `go.mod`, different `main` package), separate Dockerfile, separate
  # port. Validates HMAC playback tokens, proxies segments (storage hidden).
  loadplay:
    image: ${LOADPLAY_IMAGE:-ghcr.io/OWNER/REPO/loadplay:latest}
    container_name: goupload-loadplay
    restart: unless-stopped
    <<: *hardening
    logging: *default-logging
    env_file:
      - ./loadplay.env
    environment:
      # On-disk segment cache. loadplay caps it at SEGMENT_CACHE_MAX_BYTES and
      # sweeps entries older than SEGMENT_CACHE_TTL every SEGMENT_CACHE_SWEEP,
      # so the volume below never grows past ~20 GiB.
      - SEGMENT_CACHE_DIR=/cache
      # 8 GiB, not the 20 GiB library default. This shares a 100 GB disk with
      # the upload volume, the fingerprint volume and several ML images, and a
      # cache is a speed optimisation, not something worth an outage.
      - SEGMENT_CACHE_MAX_BYTES=${LOADPLAY_CACHE_BYTES:-8589934592}
      - SEGMENT_CACHE_TTL=${LOADPLAY_CACHE_TTL:-1h}
      - SEGMENT_CACHE_SWEEP=${LOADPLAY_CACHE_SWEEP:-1h}
    ports:
      - "127.0.0.1:${LOADPLAY_PORT:-3006}:3006"
    volumes:
      - loadplay-cache:/cache
    networks:
      - goupload-net
    deploy:
      resources:
        limits:
          cpus: "${LOADPLAY_CPUS:-0.4}"
          memory: ${LOADPLAY_MEM:-256M}
    healthcheck:
      # 127.0.0.1, not localhost: Fiber binds IPv4 only and Alpine resolves
      # localhost to ::1 first, so the probe was refused since day one.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3006/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  goupload-net:
    driver: bridge
  # internal: no route in or out except to the containers attached to it.
  goupload-cache:
    driver: bridge
    internal: true

volumes:
  redis-data:
  upload-data:
  loadplay-cache:
  fingerprint-data:

name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      # 4️⃣ Create .env file BEFORE build
      - name: Create .env file from GitHub secret
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > app/.env
            echo ".env file created ✅"
          else
            echo "⚠️ No ENV_FILE secret found — skipping"
          fi

      # 5️⃣ Build project (after env is ready)
      - name: Build project
        working-directory: ./app
        run: npm run build

      # 6️⃣ Deploy built app folder to EC2
      - name: Deploy app to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/*"
          target: "/var/www/memories.brozy.org/app/"

      # 7️⃣ SSH into EC2 and start the app
      - name: Install & Start on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/memories.brozy.org/app
            npm ci

            # Stop old process if PM2 is available
            if command -v pm2 >/dev/null 2>&1; then
              echo "🔄 Restarting app using PM2..."
              pm2 delete memories || true
              pm2 start npm --name "memories" -- start
              pm2 save
            else
              echo "🚀 Starting app in background (nohup)..."
              nohup npm start > app.log 2>&1 &
            fi

      # 8️⃣ Reload Nginx
      - name: Reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl reload nginx
            echo "✅ Nginx reloaded successfully"

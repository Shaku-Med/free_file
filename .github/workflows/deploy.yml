name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      # 4️⃣ Create .env file BEFORE build
      - name: Create .env file from GitHub secret
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            cat << 'EOF' > app/.env
          ${{ secrets.ENV_FILE }}
          EOF
            echo "✅ .env file created"
            echo "📄 File size: $(wc -c < app/.env) bytes"
          else
            echo "❌ ERROR: ENV_FILE secret is empty or not found!"
            exit 1
          fi

      # 5️⃣ Build project (after env is ready)
      - name: Build project
        working-directory: ./app
        run: npm run build

      # 6️⃣ Create deployment package
      - name: Create deployment archive
        run: |
          cd app
          tar -czf ../app-deploy.tar.gz .
          cd ..
          ls -lh app-deploy.tar.gz

      # 7️⃣ Copy archive to EC2
      - name: Copy deployment package to EC2
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Copy archive using SCP
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            app-deploy.tar.gz \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/
          
          # Clean up key
          rm ~/.ssh/deploy_key

      # 8️⃣ Extract and restart on EC2
      - name: Deploy and restart on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment..."
            
            # Ensure directory exists
            mkdir -p /var/www/memories.brozy.org/app
            
            # Backup current app (optional)
            if [ -d /var/www/memories.brozy.org/app/backup ]; then
              rm -rf /var/www/memories.brozy.org/app/backup
            fi
            
            # Extract new version
            cd /var/www/memories.brozy.org/app
            tar -xzf /tmp/app-deploy.tar.gz
            rm /tmp/app-deploy.tar.gz
            
            echo "📦 Files extracted"
            
            # Install production dependencies (in case package.json changed)
            npm ci --production
            
            echo "📚 Dependencies installed"
            
            # Restart app with PM2
            if command -v pm2 >/dev/null 2>&1; then
              echo "🔄 Restarting app with PM2..."
              pm2 delete memories 2>/dev/null || true
              pm2 start npm --name "memories" -- start
              pm2 save
              pm2 list
            else
              echo "🚀 Starting app with nohup..."
              # Kill any existing process
              pkill -f "npm start" 2>/dev/null || true
              sleep 2
              # Start new process
              nohup npm start > app.log 2>&1 &
              echo "Process started with PID: $!"
            fi
            
            echo "✅ Application restarted"

      # 9️⃣ Reload Nginx
      - name: Reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl reload nginx
            echo "✅ Nginx reloaded successfully"
            echo ""
            echo "🎉 Deployment complete!"
            echo "🌐 Site: https://memories.brozy.org"

name: Deploy Memories to EC2
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Memories
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v5
      
      # 2️⃣ Create .env file
      - name: Create .env file from GitHub secret
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            cat << 'EOF' > app/.env
          ${{ secrets.ENV_FILE }}
          EOF
            echo "✅ .env file created"
          else
            echo "❌ ERROR: ENV_FILE secret is empty!"
            exit 1
          fi
      
      # 3️⃣ Deploy files to EC2 (NO node_modules, NO rm)
      - name: Deploy app to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/*"
          target: "/var/www/memories.brozy.org/"
          overwrite: true
      
      # 4️⃣ Restart app with PM2
      - name: Restart app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/memories.brozy.org/app
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart memories || echo "⚠️  App not running yet - start it manually"
            fi
            echo "✅ Files deployed successfully"

name: Deploy Memories to EC2

# App / EC2 only — never runs for GoUpload, NSFWAPI, or LoadPlay pushes.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never let two deploys race on the box; let an in-flight one finish.
concurrency:
  group: deploy-memories
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  REPO_SLUG: ${{ github.event.repository.name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.flags.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/deploy.yml'

      - name: Set deploy flag
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.app }}" = "true" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # ── CI gate: a broken typecheck never builds or ships ───────────────────
  test:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install native build libs (canvas)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ── Build the image in CI and push it to GHCR (offloads the tiny EC2) ────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          OWNER_LC=$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${REPO_SLUG}" | tr '[:upper:]' '[:lower:]')
          BASE="${REGISTRY}/${OWNER_LC}/${REPO_LC}/memories"
          echo "image=${BASE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${BASE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}
            ${{ steps.tags.outputs.latest }}
          cache-from: type=gha,scope=memories
          cache-to: type=gha,scope=memories,mode=max

  # ── Pull the freshly-built image on the EC2 and (re)start the container ──
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create .env from GitHub secret
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            cat << 'EOF' > app/.env
          ${{ secrets.ENV_FILE }}
          EOF
            echo "✅ app/.env created"
          else
            echo "❌ ERROR: ENV_FILE secret is empty!"
            exit 1
          fi

      - name: Copy compose + env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Only the compose file + secrets — the app itself ships as the image.
          # .env.notification is NOT in the repo, so the server's real one (with
          # the VAPID keys) is left untouched.
          source: "app/docker-compose.yml,app/.env"
          target: "/var/www/memories.brozy.org/"
          overwrite: true

      - name: Pull image & restart container
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/memories.brozy.org/app

            if ! command -v docker >/dev/null 2>&1; then
              echo "❌ Docker is not installed on this server."; exit 1
            fi

            # Bind mounts must point at real FILES — if .env.notification is
            # missing, Docker would silently create a DIRECTORY and break it.
            [ -f .env ] || { echo "❌ .env missing after copy"; exit 1; }
            [ -f .env.notification ] || { echo "⚠️  .env.notification missing — creating empty (push off until keys set)"; touch .env.notification; }

            # Pin compose to the exact image we just pushed, in a file that is
            # SEPARATE from the secrets .env (so compose never parses secrets).
            printf 'APP_IMAGE=%s\n' "$APP_IMAGE" > .env.deploy

            # Pull FIRST — if login/pull fails we bail before touching the
            # running app, so the old process keeps serving (no downtime).
            echo "🔑 Logging in to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            echo "🐳 Pulling $APP_IMAGE ..."
            docker compose --env-file .env.deploy pull

            # Only now hand port 3000 over from the old PM2 process.
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete memories >/dev/null 2>&1 || true
            fi

            echo "🚀 (Re)starting container..."
            docker compose --env-file .env.deploy up -d --remove-orphans

            docker logout ghcr.io >/dev/null 2>&1 || true
            # -a, not just dangling: every deploy ships a new SHA-tagged image, and
            # the old one stays *tagged* (not <none>), so plain prune -f never touched
            # it and they piled up to 40 images / 29GB. -af drops all images no running
            # container references — i.e. the previous deploy's — while the one we just
            # started with `up -d` is protected because it's in use.
            docker image prune -af >/dev/null 2>&1 || true
            docker compose --env-file .env.deploy ps
            echo "✅ Memories deployed via GHCR image"

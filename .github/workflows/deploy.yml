name: Deploy Memories to EC2

# App / EC2 only  never runs for GoUpload, NSFWAPI, or LoadPlay pushes.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.flags.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/deploy.yml'

      - name: Set deploy flag
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.app }}" = "true" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Memories
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create .env file from GitHub secret
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            cat << 'EOF' > app/.env
          ${{ secrets.ENV_FILE }}
          EOF
            echo "✅ .env file created"
          else
            echo "❌ ERROR: ENV_FILE secret is empty!"
            exit 1
          fi

      - name: Deploy app to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/*"
          target: "/var/www/memories.brozy.org/"
          overwrite: true

      - name: Restart app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/memories.brozy.org/app
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart memories || echo "⚠️  App not running yet - start it manually"
            fi
            echo "✅ Files deployed successfully"

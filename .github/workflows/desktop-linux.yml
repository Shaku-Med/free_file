name: Desktop Linux build

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Built on the oldest Ubuntu runner so the AppImage's glibc floor stays low
    # and it runs on older distros too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: linux-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-

      - run: npm ci

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: memories-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

name: Deploy GoUpload (Docker)

on:
  push:
    branches: [main]
    paths:
      - 'GoUpload/**'
      - 'NSFWAPI/**'
      - '.github/workflows/deploy-goupload.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  REPO_SLUG: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      goupload_image: ${{ steps.tags.outputs.goupload }}
      nsfwapi_image: ${{ steps.tags.outputs.nsfwapi }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          OWNER_LC=$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${REPO_SLUG}" | tr '[:upper:]' '[:lower:]')
          BASE_GO="${REGISTRY}/${OWNER_LC}/${REPO_LC}/goupload"
          BASE_NSFW="${REGISTRY}/${OWNER_LC}/${REPO_LC}/nsfwapi"
          echo "goupload=${BASE_GO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "nsfwapi=${BASE_NSFW}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "goupload_latest=${BASE_GO}:latest" >> "$GITHUB_OUTPUT"
          echo "nsfwapi_latest=${BASE_NSFW}:latest" >> "$GITHUB_OUTPUT"

      - name: Build & push GoUpload
        uses: docker/build-push-action@v6
        with:
          context: ./GoUpload
          file: ./GoUpload/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.goupload }}
            ${{ steps.tags.outputs.goupload_latest }}
          cache-from: type=gha,scope=goupload
          cache-to: type=gha,scope=goupload,mode=max

      - name: Build & push NSFWAPI
        uses: docker/build-push-action@v6
        with:
          context: ./NSFWAPI
          file: ./NSFWAPI/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.nsfwapi }}
            ${{ steps.tags.outputs.nsfwapi_latest }}
          cache-from: type=gha,scope=nsfwapi
          cache-to: type=gha,scope=nsfwapi,mode=max

  deploy:
    name: Deploy to VPS
    # Runs on the self-hosted runner registered on the VPS itself — no SSH,
    # no scp, no Hostinger firewall to fight. The runner process is owned by
    # `hoster`, which has the same sudo NOPASSWD entries we configured for
    # the SSH path (protect-env.sh + goupload-compose.sh), so the rest of
    # the security model is unchanged.
    runs-on: self-hosted
    needs: build
    permissions:
      contents: read
      # Auto-injected GITHUB_TOKEN with read:packages — pulls the images we
      # just pushed in the build job. No GHCR_PULL_TOKEN PAT to maintain.
      packages: read
    env:
      STAGING: /home/hoster/goupload-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage compose + env files into ~/goupload-staging
        env:
          GOUPLOAD_ENV: ${{ secrets.VPS_ENV }}
          NSFWAPI_ENV: ${{ secrets.NSFWAPI_ENV }}
        run: |
          set -euo pipefail
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          cp GoUpload/docker-compose.yml "$STAGING/docker-compose.yml"
          printf '%s' "$GOUPLOAD_ENV"  > "$STAGING/goupload.env"
          printf '%s' "$NSFWAPI_ENV"   > "$STAGING/nsfwapi.env"

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo  "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          cat > "$STAGING/.env" <<EOF
          GOUPLOAD_IMAGE=ghcr.io/${OWNER_LC}/${REPO_LC}/goupload:${GITHUB_SHA}
          NSFWAPI_IMAGE=ghcr.io/${OWNER_LC}/${REPO_LC}/nsfwapi:${GITHUB_SHA}
          GOUPLOAD_PORT=3003
          # Tuned for a 2 CPU VPS. goupload + nsfwapi + redis must sum to
          # <2.00 with headroom for the host. WORKER_MAX must not exceed
          # GOUPLOAD_CPUS or transcodes will throttle each other.
          GOUPLOAD_CPUS=1.4
          GOUPLOAD_MEM=2G
          NSFWAPI_CPUS=0.4
          NSFWAPI_MEM=512M
          WORKER_MIN=1
          WORKER_MAX=2
          WORKER_INITIAL=1
          EOF

          # Ship the runtime wrappers too — protect-env.sh self-updates these
          # so a fix in the repo lands on the VPS next deploy automatically.
          cp GoUpload/scripts/goupload-compose.sh "$STAGING/goupload-compose.sh"
          cp GoUpload/scripts/dangerous-guard.sh  "$STAGING/dangerous-guard.sh"

      - name: Promote staged files into /opt/goupload
        run: |
          set -euo pipefail
          # protect-env.sh: moves staged files → /opt/goupload as root:root
          # 0600, refreshes the wrapper scripts, wipes staging. Allowed via
          # NOPASSWD in /etc/sudoers.d/goupload-hardening.
          sudo /usr/local/sbin/protect-env.sh

      - name: Pull images & restart stack
        env:
          GHCR_USER: ${{ github.actor }}
          # GITHUB_TOKEN is auto-injected with the permissions block above —
          # no PAT to set up, expires when the job ends.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticate ghcr (token via stdin — never as argv).
          printf '%s' "$GHCR_TOKEN" | sudo /usr/local/sbin/goupload-compose.sh login "$GHCR_USER"
          sudo /usr/local/sbin/goupload-compose.sh pull
          sudo /usr/local/sbin/goupload-compose.sh up
          sudo /usr/local/sbin/goupload-compose.sh prune || true
          echo "✅ Deployed"
          sudo /usr/local/sbin/goupload-compose.sh ps

      - name: Logout from ghcr
        if: always()
        run: |
          sudo /usr/local/sbin/goupload-compose.sh logout || true

name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'GoUpload/**'
      - 'NSFWAPI/**'
      - '.github/workflows/deploy-goupload.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== GoUpload Deployment ====================
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: GoUpload/go.sum

      - name: Build GoUpload
        run: |
          cd GoUpload
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o goupload .

      - name: Create .env for GoUpload
        env:
          VPS_ENV: ${{ secrets.VPS_ENV }}
        run: |
          printf '%s' "$VPS_ENV" > GoUpload/.env

      - name: Copy GoUpload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.HOSTER_SSH_KEY }}
          source: 'GoUpload/goupload,GoUpload/.env'
          target: /opt/goupload/
          strip_components: 1

      - name: Restart GoUpload Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.HOSTER_SSH_KEY }}
          script: |
            sudo chown hoster:hoster /opt/goupload/goupload
            sudo chown hoster:hoster /opt/goupload/.env
            sudo chmod +x /opt/goupload/goupload
            sudo systemctl restart goupload
            echo "✅ GoUpload restarted"

      # ==================== NSFWAPI Deployment ====================
      - name: Copy NSFWAPI to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.HOSTER_SSH_KEY }}
          source: 'NSFWAPI/*'
          target: /opt/goupload/nsfwapi/
          strip_components: 1
          overwrite: true

      - name: Install and Build NSFWAPI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.HOSTER_SSH_KEY }}
          script: |
            # Fix ownership
            sudo chown -R hoster:hoster /opt/goupload/nsfwapi
            
            cd /opt/goupload/nsfwapi
            
            # Clean up
            rm -rf node_modules package-lock.json dist
            
            # Install all dependencies (including dev for build)
            npm install
            
            # Build TypeScript
            npm run build
            
            # Verify build
            if [ ! -f "dist/index.js" ]; then
              echo "❌ Build failed - dist/index.js not found"
              exit 1
            fi
            
            echo "✅ NSFWAPI built successfully"

      # ==================== Deployment Complete ====================
      - name: Show Deployment Status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.HOSTER_SSH_KEY }}
          script: |
            echo ""
            echo "📊 Deployment Status:"
            echo "===================="
            echo ""
            echo "GoUpload Service:"
            sudo systemctl status goupload --no-pager | head -10
            echo ""
            echo "NSFWAPI Files:"
            ls -lh /opt/goupload/nsfwapi/dist/
            echo ""
            echo "✅ Deployment complete!"
            echo ""
            echo "🔧 Manual steps remaining:"
            echo "   1. SSH into your VPS"
            echo "   2. cd /opt/goupload/nsfwapi"
            echo "   3. pm2 delete nsfwapi || true"
            echo "   4. pm2 start dist/index.js --name nsfwapi"
            echo "   5. pm2 save"
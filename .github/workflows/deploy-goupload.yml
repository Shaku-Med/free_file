name: Deploy GoUpload (Docker)

on:
  push:
    branches: [main]
    paths:
      - 'GoUpload/**'
      - 'NSFWAPI/**'
      - '.github/workflows/deploy-goupload.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  REPO_SLUG: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      goupload_image: ${{ steps.tags.outputs.goupload }}
      nsfwapi_image: ${{ steps.tags.outputs.nsfwapi }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          OWNER_LC=$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${REPO_SLUG}" | tr '[:upper:]' '[:lower:]')
          BASE_GO="${REGISTRY}/${OWNER_LC}/${REPO_LC}/goupload"
          BASE_NSFW="${REGISTRY}/${OWNER_LC}/${REPO_LC}/nsfwapi"
          echo "goupload=${BASE_GO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "nsfwapi=${BASE_NSFW}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "goupload_latest=${BASE_GO}:latest" >> "$GITHUB_OUTPUT"
          echo "nsfwapi_latest=${BASE_NSFW}:latest" >> "$GITHUB_OUTPUT"

      - name: Build & push GoUpload
        uses: docker/build-push-action@v6
        with:
          context: ./GoUpload
          file: ./GoUpload/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.goupload }}
            ${{ steps.tags.outputs.goupload_latest }}
          cache-from: type=gha,scope=goupload
          cache-to: type=gha,scope=goupload,mode=max

      - name: Build & push NSFWAPI
        uses: docker/build-push-action@v6
        with:
          context: ./NSFWAPI
          file: ./NSFWAPI/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.nsfwapi }}
            ${{ steps.tags.outputs.nsfwapi_latest }}
          cache-from: type=gha,scope=nsfwapi
          cache-to: type=gha,scope=nsfwapi,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage compose + env files
        env:
          GOUPLOAD_ENV: ${{ secrets.VPS_ENV }}
          NSFWAPI_ENV: ${{ secrets.NSFWAPI_ENV }}
        run: |
          mkdir -p deploy
          cp GoUpload/docker-compose.yml deploy/docker-compose.yml
          printf '%s' "$GOUPLOAD_ENV"  > deploy/goupload.env
          printf '%s' "$NSFWAPI_ENV"   > deploy/nsfwapi.env
          # NOTE: leave perms at the runner default (0644). appleboy/scp-action
          # runs in a Docker container with a different UID and its `tar` can't
          # read 0600 files. The runner is ephemeral; the env files only exist
          # here for ~10 seconds. protect-env.sh on the VPS re-locks them to
          # root:root 0600 the moment they land.

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          cat > deploy/.env <<EOF
          GOUPLOAD_IMAGE=ghcr.io/${OWNER_LC}/${REPO_LC}/goupload:${GITHUB_SHA}
          NSFWAPI_IMAGE=ghcr.io/${OWNER_LC}/${REPO_LC}/nsfwapi:${GITHUB_SHA}
          GOUPLOAD_PORT=3003
          GOUPLOAD_CPUS=2.5
          GOUPLOAD_MEM=4G
          NSFWAPI_CPUS=1.0
          NSFWAPI_MEM=768M
          WORKER_MIN=1
          WORKER_MAX=6
          WORKER_INITIAL=2
          EOF
          # Perms intentionally left at 0644 — see comment above.

      # Simple deploy: scp into the SSH user's home, then ssh to move into
      # /opt/goupload and run docker compose directly. Assumes VPS_USER is
      # root (or a user already in the docker group). The optional
      # harden-vps.sh hardening is a SEPARATE, manual step the operator
      # runs once — see GoUpload/scripts/README. This workflow tolerates
      # both the hardened and unhardened server states.
      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.HOSTER_SSH_KEY }}
          source: 'deploy/docker-compose.yml,deploy/goupload.env,deploy/nsfwapi.env,deploy/.env'
          target: goupload-staging/
          strip_components: 1
          overwrite: true

      - name: Pull & restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.HOSTER_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail

            # Sanity-check staged files
            test -f "$HOME/goupload-staging/docker-compose.yml"
            test -f "$HOME/goupload-staging/goupload.env"
            test -f "$HOME/goupload-staging/nsfwapi.env"
            test -f "$HOME/goupload-staging/.env"

            # Pick `sudo` only if we're not already root — keeps this
            # workflow working whether VPS_USER is root or a sudoer.
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo"
            fi

            # If the hardened wrappers are installed, prefer them. Otherwise
            # do a direct move + chmod. Either path ends with /opt/goupload
            # populated and ready for docker compose.
            if [ -x /usr/local/sbin/protect-env.sh ]; then
              echo "→ using hardened protect-env.sh wrapper"
              $SUDO /usr/local/sbin/protect-env.sh
            else
              echo "→ no protect-env.sh, doing direct move"
              $SUDO mkdir -p /opt/goupload
              $SUDO mv "$HOME/goupload-staging/docker-compose.yml" /opt/goupload/
              $SUDO mv "$HOME/goupload-staging/goupload.env"       /opt/goupload/
              $SUDO mv "$HOME/goupload-staging/nsfwapi.env"        /opt/goupload/
              $SUDO mv "$HOME/goupload-staging/.env"               /opt/goupload/
              $SUDO chown -R root:root /opt/goupload
              $SUDO chmod 0600 /opt/goupload/*.env /opt/goupload/.env
              $SUDO chmod 0644 /opt/goupload/docker-compose.yml
              rmdir "$HOME/goupload-staging" 2>/dev/null || true
            fi

            cd /opt/goupload

            # Same fallback pattern for compose: hardened wrapper if present,
            # otherwise call docker compose directly.
            if [ -x /usr/local/sbin/goupload-compose.sh ]; then
              echo "$GHCR_TOKEN" | $SUDO /usr/local/sbin/goupload-compose.sh login "$GHCR_USER"
              $SUDO /usr/local/sbin/goupload-compose.sh pull
              $SUDO /usr/local/sbin/goupload-compose.sh up
              $SUDO /usr/local/sbin/goupload-compose.sh prune || true
              echo "✅ Deployed"
              $SUDO /usr/local/sbin/goupload-compose.sh ps
            else
              echo "$GHCR_TOKEN" | $SUDO docker login ghcr.io -u "$GHCR_USER" --password-stdin
              $SUDO docker compose pull
              $SUDO docker compose up -d --remove-orphans
              $SUDO docker image prune -f --filter "until=72h" || true
              echo "✅ Deployed"
              $SUDO docker compose ps
            fi

      - name: Logout from ghcr on VPS
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.HOSTER_SSH_KEY }}
          script: |
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
            if [ -x /usr/local/sbin/goupload-compose.sh ]; then
              $SUDO /usr/local/sbin/goupload-compose.sh logout || true
            else
              $SUDO docker logout ghcr.io || true
            fi

name: Deploy GoUpload (Docker)

# VPS / Go stack only  never runs for app-only pushes.
on:
  push:
    branches: [main]
    paths:
      - 'GoUpload/**'
      - 'NSFWAPI/**'
      - '.github/workflows/deploy-goupload.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  REPO_SLUG: ${{ github.event.repository.name }}
  # dorny/paths-filter@v3 still ships a Node 20 runtime; this opts the
  # action into the Node 24 runner so we don't fail on Sept 16, 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      goupload: ${{ steps.flags.outputs.goupload }}
      embedapi: ${{ steps.flags.outputs.embedapi }}
      nsfwapi: ${{ steps.flags.outputs.nsfwapi }}
      loadplay: ${{ steps.flags.outputs.loadplay }}
      compose: ${{ steps.flags.outputs.compose }}
      any: ${{ steps.flags.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            goupload:
              - 'GoUpload/**'
              - '!GoUpload/loadplay/**'
              - '!GoUpload/LoadPlay/**'
              - '!GoUpload/NSFWAPI/**'
              - '!GoUpload/EmbedAPI/**'
            loadplay:
              - 'GoUpload/loadplay/**'
              - 'GoUpload/LoadPlay/**'
            shared:
              - 'GoUpload/go.mod'
              - 'GoUpload/go.sum'
              - 'GoUpload/lib/**'
            nsfwapi:
              - 'NSFWAPI/**'
              - 'GoUpload/NSFWAPI/**'
            embedapi:
              - 'GoUpload/EmbedAPI/**'
            compose:
              - 'GoUpload/docker-compose.yml'
              - 'GoUpload/scripts/**'
            workflow:
              - '.github/workflows/deploy-goupload.yml'

      - name: Set deploy flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "goupload=true" >> "$GITHUB_OUTPUT"
            echo "embedapi=true" >> "$GITHUB_OUTPUT"
            echo "nsfwapi=true" >> "$GITHUB_OUTPUT"
            echo "loadplay=true" >> "$GITHUB_OUTPUT"
            echo "compose=true" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          wf="${{ steps.filter.outputs.workflow }}"
          shared="${{ steps.filter.outputs.shared }}"
          goupload="${{ steps.filter.outputs.goupload }}"
          loadplay="${{ steps.filter.outputs.loadplay }}"
          nsfwapi="${{ steps.filter.outputs.nsfwapi }}"
          embedapi="${{ steps.filter.outputs.embedapi }}"
          compose="${{ steps.filter.outputs.compose }}"

          if [ "$shared" = "true" ]; then
            goupload=true
            loadplay=true
          fi
          if [ "$wf" = "true" ]; then
            goupload=true
            embedapi=true
            nsfwapi=true
            loadplay=true
            compose=true
          fi

          deploy_goupload=false
          deploy_embedapi=false
          deploy_nsfwapi=false
          deploy_loadplay=false
          deploy_compose=false
          any=false

          [ "$goupload" = "true" ] && deploy_goupload=true && any=true
          [ "$embedapi" = "true" ] && deploy_embedapi=true && any=true
          [ "$loadplay" = "true" ] && deploy_loadplay=true && any=true
          [ "$nsfwapi" = "true" ] && deploy_nsfwapi=true && any=true
          [ "$compose" = "true" ] && deploy_compose=true && any=true

          echo "goupload=$deploy_goupload" >> "$GITHUB_OUTPUT"
          echo "embedapi=$deploy_embedapi" >> "$GITHUB_OUTPUT"
          echo "nsfwapi=$deploy_nsfwapi" >> "$GITHUB_OUTPUT"
          echo "loadplay=$deploy_loadplay" >> "$GITHUB_OUTPUT"
          echo "compose=$deploy_compose" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"

  build:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          OWNER_LC=$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${REPO_SLUG}" | tr '[:upper:]' '[:lower:]')
          BASE_GO="${REGISTRY}/${OWNER_LC}/${REPO_LC}/goupload"
          BASE_NSFW="${REGISTRY}/${OWNER_LC}/${REPO_LC}/nsfwapi"
          BASE_EMBED="${REGISTRY}/${OWNER_LC}/${REPO_LC}/embedapi"
          BASE_LP="${REGISTRY}/${OWNER_LC}/${REPO_LC}/loadplay"
          echo "goupload=${BASE_GO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "nsfwapi=${BASE_NSFW}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "embedapi=${BASE_EMBED}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "loadplay=${BASE_LP}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "goupload_latest=${BASE_GO}:latest" >> "$GITHUB_OUTPUT"
          echo "nsfwapi_latest=${BASE_NSFW}:latest" >> "$GITHUB_OUTPUT"
          echo "embedapi_latest=${BASE_EMBED}:latest" >> "$GITHUB_OUTPUT"
          echo "loadplay_latest=${BASE_LP}:latest" >> "$GITHUB_OUTPUT"

      - name: Build & push GoUpload
        if: needs.changes.outputs.goupload == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./GoUpload
          file: ./GoUpload/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.goupload }}
            ${{ steps.tags.outputs.goupload_latest }}
          cache-from: type=gha,scope=goupload
          cache-to: type=gha,scope=goupload,mode=max

      - name: Build & push NSFWAPI
        if: needs.changes.outputs.nsfwapi == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./NSFWAPI
          file: ./NSFWAPI/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.nsfwapi }}
            ${{ steps.tags.outputs.nsfwapi_latest }}
          cache-from: type=gha,scope=nsfwapi
          cache-to: type=gha,scope=nsfwapi,mode=max

      - name: Build & push EmbedAPI
        if: needs.changes.outputs.embedapi == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./GoUpload/EmbedAPI
          file: ./GoUpload/EmbedAPI/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.embedapi }}
            ${{ steps.tags.outputs.embedapi_latest }}
          cache-from: type=gha,scope=embedapi
          cache-to: type=gha,scope=embedapi,mode=max

      - name: Build & push LoadPlay
        if: needs.changes.outputs.loadplay == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./GoUpload
          file: ./GoUpload/loadplay/Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.tags.outputs.loadplay }}
            ${{ steps.tags.outputs.loadplay_latest }}
          cache-from: type=gha,scope=loadplay
          cache-to: type=gha,scope=loadplay,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    needs: [changes, build]
    if: |
      always() &&
      needs.changes.outputs.any == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      contents: read
      packages: read
    env:
      STAGING: /home/hoster/goupload-staging
      DEPLOY_GOUPLOAD: ${{ needs.changes.outputs.goupload }}
      DEPLOY_EMBEDAPI: ${{ needs.changes.outputs.embedapi }}
      DEPLOY_NSFWAPI: ${{ needs.changes.outputs.nsfwapi }}
      DEPLOY_LOADPLAY: ${{ needs.changes.outputs.loadplay }}
      DEPLOY_COMPOSE: ${{ needs.changes.outputs.compose }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage compose + env files into ~/goupload-staging
        env:
          GOUPLOAD_ENV: ${{ secrets.VPS_ENV }}
          NSFWAPI_ENV: ${{ secrets.NSFWAPI_ENV }}
          LOADPLAY_ENV: ${{ secrets.LOADPLAY_ENV }}
          EMBED_API_SECRET: ${{ secrets.EMBED_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${EMBED_API_SECRET:-}" ]; then
            echo "ERROR: GitHub secret EMBED_API_SECRET is empty. Add the same value as GoUpload/.env." >&2
            exit 1
          fi
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          cp GoUpload/docker-compose.yml "$STAGING/docker-compose.yml"
          printf '%s' "$GOUPLOAD_ENV"  > "$STAGING/goupload.env"
          printf '%s' "$NSFWAPI_ENV"   > "$STAGING/nsfwapi.env"
          printf '%s' "$LOADPLAY_ENV"  > "$STAGING/loadplay.env"

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo  "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${OWNER_LC}/${REPO_LC}"

          # Keep running tags for services we did not rebuild this push.
          GOUPLOAD_TAG="latest"
          NSFWAPI_TAG="latest"
          EMBEDAPI_TAG="latest"
          LOADPLAY_TAG="latest"
          if [ -f /opt/goupload/.env ]; then
            # shellcheck disable=SC1091
            source /opt/goupload/.env
            GOUPLOAD_TAG="${GOUPLOAD_IMAGE##*:}"
            NSFWAPI_TAG="${NSFWAPI_IMAGE##*:}"
            EMBEDAPI_TAG="${EMBEDAPI_IMAGE##*:}"
            LOADPLAY_TAG="${LOADPLAY_IMAGE##*:}"
          fi
          if [ "$DEPLOY_GOUPLOAD" = "true" ]; then GOUPLOAD_TAG="${GITHUB_SHA}"; fi
          if [ "$DEPLOY_NSFWAPI" = "true" ]; then NSFWAPI_TAG="${GITHUB_SHA}"; fi
          if [ "$DEPLOY_EMBEDAPI" = "true" ]; then EMBEDAPI_TAG="${GITHUB_SHA}"; fi
          if [ "$DEPLOY_LOADPLAY" = "true" ]; then LOADPLAY_TAG="${GITHUB_SHA}"; fi

          cat > "$STAGING/.env" <<EOF
          GOUPLOAD_IMAGE=${BASE}/goupload:${GOUPLOAD_TAG}
          NSFWAPI_IMAGE=${BASE}/nsfwapi:${NSFWAPI_TAG}
          EMBEDAPI_IMAGE=${BASE}/embedapi:${EMBEDAPI_TAG}
          LOADPLAY_IMAGE=${BASE}/loadplay:${LOADPLAY_TAG}
          EMBED_API_SECRET=${EMBED_API_SECRET}
          GOUPLOAD_PORT=3003
          LOADPLAY_PORT=3006
          GOUPLOAD_CPUS=1.2
          GOUPLOAD_MEM=2G
          NSFWAPI_CPUS=0.4
          NSFWAPI_MEM=512M
          EMBEDAPI_CPUS=0.75
          EMBEDAPI_MEM=512M
          EMBED_THREADS=1
          LOADPLAY_CPUS=0.3
          LOADPLAY_MEM=256M
          WORKER_MIN=1
          WORKER_MAX=2
          WORKER_INITIAL=1
          EOF

          cp GoUpload/scripts/goupload-compose.sh "$STAGING/goupload-compose.sh"
          cp GoUpload/scripts/dangerous-guard.sh  "$STAGING/dangerous-guard.sh"

          echo "Deploy targets: goupload=$DEPLOY_GOUPLOAD embedapi=$DEPLOY_EMBEDAPI nsfwapi=$DEPLOY_NSFWAPI loadplay=$DEPLOY_LOADPLAY compose=$DEPLOY_COMPOSE"

      - name: Promote staged files into /opt/goupload
        run: |
          set -euo pipefail
          sudo /usr/local/sbin/protect-env.sh

      - name: Pull images & restart changed services
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | sudo /usr/local/sbin/goupload-compose.sh login "$GHCR_USER"

          SERVICES=()
          [ "$DEPLOY_GOUPLOAD" = "true" ] && SERVICES+=(goupload embedapi)
          [ "$DEPLOY_EMBEDAPI" = "true" ] && SERVICES+=(embedapi)
          [ "$DEPLOY_NSFWAPI" = "true" ] && SERVICES+=(nsfwapi)
          [ "$DEPLOY_LOADPLAY" = "true" ] && SERVICES+=(loadplay)

          if [ ${#SERVICES[@]} -eq 0 ] && [ "$DEPLOY_COMPOSE" = "true" ]; then
            SERVICES=(goupload embedapi nsfwapi loadplay)
          fi

          # Deduplicate service names (bash 4+).
          if [ ${#SERVICES[@]} -gt 0 ]; then
            mapfile -t SERVICES < <(printf '%s\n' "${SERVICES[@]}" | awk '!seen[$0]++')
          fi

          if [ ${#SERVICES[@]} -gt 0 ]; then
            sudo /usr/local/sbin/goupload-compose.sh pull "${SERVICES[@]}"
            sudo /usr/local/sbin/goupload-compose.sh up "${SERVICES[@]}"
          elif [ "$DEPLOY_COMPOSE" = "true" ]; then
            sudo /usr/local/sbin/goupload-compose.sh up
          else
            echo "Nothing to pull/restart"
          fi

          sudo /usr/local/sbin/goupload-compose.sh prune || true
          echo "✅ Deployed"
          sudo /usr/local/sbin/goupload-compose.sh ps

      - name: Logout from ghcr
        if: always()
        run: |
          sudo /usr/local/sbin/goupload-compose.sh logout || true
